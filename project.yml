# Generate Rotato.xcodeproj with XcodeGen:  brew install xcodegen && xcodegen
name: Rotato
options:
  bundleIdPrefix: com.chrisalvis
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your team (Xcode → Settings → Accounts). Leave blank and pick it under Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  RotatoKit:
    path: RotatoKit

schemes:
  Rotato:
    build:
      targets:
        Rotato: all
        RotatoWidget: all
    archive:
      config: Release

targets:
  Rotato:
    type: application
    platform: iOS
    sources:
      - App
      # Built into the app itself so Shortcuts can find the actions.
      - RotatoKit/Sources/RotatoIntents
    dependencies:
      - package: RotatoKit
        product: RotatoKit
      - package: RotatoKit
        product: RotatoUI
      - target: RotatoWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rotato
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.chrisalvis.rotato
            CFBundleURLSchemes: [rotato]
        LSApplicationQueriesSchemes: [shortcuts]
        NSPhotoLibraryAddUsageDescription: Rotato saves wallpapers you choose to your photo library.
        NSFaceIDUsageDescription: Rotato uses Face ID to unlock your locked collections.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Rotato.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chrisalvis.rotato]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisalvis.rotato
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  RotatoWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - RotatoKit/Sources/RotatoIntents
    dependencies:
      - package: RotatoKit
        product: RotatoKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Rotato
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/RotatoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chrisalvis.rotato]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisalvis.rotato.widget
        TARGETED_DEVICE_FAMILY: "1"
