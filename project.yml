name: Rotato
options:
  bundleIdPrefix: com.chrisalvis
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"

targets:
  Rotato:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Rotato
    info:
      path: Rotato/Info.plist
      properties:
        CFBundleDisplayName: Rotato
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "Rotato saves wallpapers to your Photos library."
        NSPhotoLibraryUsageDescription: "Rotato reads your photos for collections."
        CFBundleURLTypes:
          - CFBundleURLName: rotato-callback
            CFBundleURLSchemes:
              - rotato
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisalvis.rotato
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_FILE: Rotato/Info.plist
